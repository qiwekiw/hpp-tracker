<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Dashboard HPP</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-alt: #1e222b; --border: #2a2f3a;
    --text: #e8e9ec; --dim: #9aa0ab; --accent: #4f8cff; --green: #35c98f; --red: #ff5d6c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.4;
    padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
  .sub { color: var(--dim); font-size: 13px; }

  a.btn, button, select, input[type="search"] {
    font: inherit; font-size: 14px; color: var(--text); background: var(--panel-alt);
    border: 1px solid var(--border); border-radius: 8px; min-height: 40px; padding: 8px 14px;
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  input[type="search"] { cursor: text; justify-content: flex-start; width: 100%; }
  a.btn:hover, button:hover { border-color: var(--accent); }
  a.btn:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .primary:hover { background: #3f7ae0; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .stat .k { font-size: 12px; color: var(--dim); }
  .stat .v { font-size: 18px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat .v.g { color: var(--green); }
  .stat .s { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* chart */
  .bar { display: grid; grid-template-columns: minmax(70px, 28%) 1fr auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
  .bar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { height: 12px; background: var(--panel-alt); border-radius: 6px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 6px; min-width: 2px; }
  .bar .val { color: var(--green); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }

  /* file cards */
  .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .fcard { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .fcard .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fcard .m { font-size: 12px; color: var(--dim); }
  .fcard .tot { color: var(--green); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
  .fcard .btn { margin-top: 4px; min-height: 36px; font-size: 13px; }

  /* filter bar */
  .filters { display: grid; grid-template-columns: 1fr 200px 200px auto; gap: 8px; margin-bottom: 12px; }

  /* table */
  .tbl { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .thead, .trow {
    display: grid; gap: 8px; align-items: center; padding: 9px 12px;
    grid-template-columns: minmax(0,1.2fr) minmax(0,2fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.3fr);
  }
  .thead { background: var(--panel-alt); color: var(--dim); font-size: 12px; font-weight: 600; }
  .trow { border-top: 1px solid var(--border); font-size: 14px; }
  .r { text-align: right; }
  .trow > div { min-width: 0; overflow-wrap: anywhere; }
  .d-file { color: var(--dim); font-size: 13px; }
  .d-total { color: var(--green); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .d-harga, .d-qty { font-variant-numeric: tabular-nums; }
  .d-harga { text-align: right; }
  .tfoot { display: flex; justify-content: space-between; padding: 12px; background: var(--panel-alt); border-top: 1px solid var(--border); font-weight: 600; }
  .tfoot strong { color: var(--green); font-variant-numeric: tabular-nums; }
  .empty { padding: 28px 16px; text-align: center; color: var(--dim); font-size: 14px; }
  .empty a { color: var(--accent); }

  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .filters { grid-template-columns: 1fr 1fr; }
    .filters input[type="search"] { grid-column: 1 / -1; }
    .filters button { grid-column: 1 / -1; }
    .thead { display: none; }
    .trow {
      grid-template-columns: minmax(0,1fr) auto;
      grid-template-areas: "nama nama" "qty harga" "file total";
      gap: 4px 10px; padding: 12px;
    }
    .d-nama { grid-area: nama; font-weight: 600; }
    .d-qty { grid-area: qty; color: var(--dim); font-size: 13px; }
    .d-harga { grid-area: harga; color: var(--dim); font-size: 13px; }
    .d-file { grid-area: file; align-self: center; }
    .d-total { grid-area: total; font-size: 16px; }
    .bar { grid-template-columns: 1fr auto; }
    .bar .track { grid-column: 1 / -1; order: 3; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Dashboard HPP</h1>
      <div class="sub" id="sub">Ringkasan semua file yang sudah dicatat di Home.</div>
    </div>
    <a class="btn" href="index.html">← Home</a>
  </header>

  <div class="stats">
    <div class="stat"><div class="k">Jumlah file</div><div class="v" id="sFiles">0</div></div>
    <div class="stat"><div class="k">Jumlah barang</div><div class="v" id="sItems">0</div></div>
    <div class="stat"><div class="k">Total semua modal</div><div class="v g" id="sTotal">Rp 0</div></div>
    <div class="stat"><div class="k">Barang terbesar</div><div class="v" id="sTop">-</div><div class="s" id="sTopVal"></div></div>
  </div>

  <div class="card" id="chartCard">
    <h2>Total per file</h2>
    <div id="chart"></div>
  </div>

  <div class="card">
    <h2>Semua file</h2>
    <div class="files" id="files"></div>
  </div>

  <div class="card">
    <h2>Semua barang</h2>
    <div class="filters">
      <input type="search" id="q" placeholder="Cari nama barang atau file" aria-label="Cari">
      <select id="fFile" aria-label="Filter file"></select>
      <select id="fSort" aria-label="Urutkan">
        <option value="total-desc">Total terbesar</option>
        <option value="total-asc">Total terkecil</option>
        <option value="nama-asc">Nama A–Z</option>
        <option value="file-asc">Per file</option>
      </select>
      <button id="btnCsv">Export CSV</button>
    </div>
    <div class="tbl">
      <div class="thead">
        <div>File</div><div>Barang</div><div>Jumlah</div><div class="r">Harga</div><div class="r">Total</div>
      </div>
      <div id="trows"></div>
      <div class="tfoot"><span id="fCount">0 barang</span><strong id="fTotal">Rp 0</strong></div>
    </div>
  </div>
</div>

<script>
(function () {
  const KEY = 'hpp_tracker_v2';
  const $ = (id) => document.getElementById(id);
  const num = (v) => parseFloat(v) || 0;
  const rupiah = (n) => 'Rp ' + Math.round(n).toLocaleString('id-ID');
  const fmtNum = (n) => (Math.round(n * 100) / 100).toLocaleString('id-ID');
  const filled = (r) => !!(String(r.nama || '').trim() || String(r.banyak || '').trim() || String(r.harga || '').trim());

  let store = { files: [], currentId: null };
  let items = [];   // semua baris dari semua file

  function load() {
    store = { files: [], currentId: null };
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && Array.isArray(p.files)) store = p;
      }
    } catch (e) { /* abaikan */ }

    items = [];
    store.files.forEach((f) => {
      (f.rows || []).forEach((r) => {
        if (!filled(r)) return;
        const qty = num(r.banyak), price = num(r.harga);
        items.push({
          fileId: f.id, file: f.name || 'HPP',
          nama: String(r.nama || '').trim() || '(tanpa nama)',
          banyak: qty, satuan: String(r.satuan || '').trim(), harga: price, total: qty * price
        });
      });
    });
  }

  const fileTotals = () => store.files.map((f) => {
    const its = items.filter((i) => i.fileId === f.id);
    return { f, count: its.length, total: its.reduce((s, i) => s + i.total, 0) };
  });

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  /* ---------- ringkasan ---------- */
  function renderStats() {
    const total = items.reduce((s, i) => s + i.total, 0);
    $('sFiles').textContent = store.files.length;
    $('sItems').textContent = items.length;
    $('sTotal').textContent = rupiah(total);
    const top = items.reduce((m, i) => (!m || i.total > m.total ? i : m), null);
    $('sTop').textContent = top && top.total > 0 ? top.nama : '-';
    $('sTopVal').textContent = top && top.total > 0 ? rupiah(top.total) + ' · ' + top.file : '';
  }

  function renderChart() {
    const box = $('chart');
    box.innerHTML = '';
    const data = fileTotals().filter((x) => x.total > 0).sort((a, b) => b.total - a.total);
    if (!data.length) {
      box.appendChild(el('div', 'empty', 'Belum ada total untuk ditampilkan.'));
      return;
    }
    const max = data[0].total;
    data.forEach((x) => {
      const row = el('div', 'bar');
      row.appendChild(el('div', 'nm', x.f.name));
      const track = el('div', 'track');
      const fill = el('div', 'fill');
      fill.style.width = Math.max(2, (x.total / max) * 100) + '%';
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el('div', 'val', rupiah(x.total)));
      box.appendChild(row);
    });
  }

  function renderFiles() {
    const box = $('files');
    box.innerHTML = '';
    if (!store.files.length) {
      box.appendChild(el('div', 'empty', 'Belum ada file.'));
      return;
    }
    fileTotals().forEach((x) => {
      const c = el('div', 'fcard');
      c.appendChild(el('div', 't', x.f.name));
      const upd = x.f.updated ? new Date(x.f.updated).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
      c.appendChild(el('div', 'm', x.count + ' barang · diubah ' + upd));
      c.appendChild(el('div', 'tot', rupiah(x.total)));
      const open = el('button', '', 'Buka di Home');
      open.type = 'button';
      open.addEventListener('click', () => openInHome(x.f.id));
      c.appendChild(open);
      box.appendChild(c);
    });
  }

  function openInHome(id) {
    try {
      const raw = localStorage.getItem(KEY);
      const p = raw ? JSON.parse(raw) : null;
      if (p && Array.isArray(p.files)) {
        p.currentId = id;
        localStorage.setItem(KEY, JSON.stringify(p));
      }
    } catch (e) { /* abaikan */ }
    location.href = 'index.html';
  }

  /* ---------- tabel semua barang ---------- */
  function fillFilter() {
    const sel = $('fFile');
    const prev = sel.value || 'all';
    sel.innerHTML = '';
    const all = el('option', '', 'Semua file');
    all.value = 'all';
    sel.appendChild(all);
    store.files.forEach((f) => {
      const o = el('option', '', f.name);
      o.value = f.id;
      sel.appendChild(o);
    });
    sel.value = [...sel.options].some((o) => o.value === prev) ? prev : 'all';
  }

  function filtered() {
    const q = $('q').value.trim().toLowerCase();
    const ff = $('fFile').value;
    let list = items.filter((i) =>
      (ff === 'all' || i.fileId === ff) &&
      (!q || i.nama.toLowerCase().includes(q) || i.file.toLowerCase().includes(q))
    );
    const s = $('fSort').value;
    const cmp = {
      'total-desc': (a, b) => b.total - a.total,
      'total-asc': (a, b) => a.total - b.total,
      'nama-asc': (a, b) => a.nama.localeCompare(b.nama, 'id'),
      'file-asc': (a, b) => a.file.localeCompare(b.file, 'id') || a.nama.localeCompare(b.nama, 'id')
    }[s];
    return list.sort(cmp);
  }

  function renderTable() {
    const list = filtered();
    const box = $('trows');
    box.innerHTML = '';
    if (!list.length) {
      const e = el('div', 'empty');
      if (!items.length) {
        e.append('Belum ada data. Isi barang dulu di ');
        const a = el('a', '', 'Home');
        a.href = 'index.html';
        e.appendChild(a);
        e.append('.');
      } else {
        e.textContent = 'Tidak ada barang yang cocok dengan pencarian.';
      }
      box.appendChild(e);
    }
    list.forEach((i) => {
      const r = el('div', 'trow');
      r.appendChild(el('div', 'd-file', i.file));
      r.appendChild(el('div', 'd-nama', i.nama));
      r.appendChild(el('div', 'd-qty', fmtNum(i.banyak) + (i.satuan ? ' ' + i.satuan : '')));
      r.appendChild(el('div', 'd-harga', rupiah(i.harga)));
      r.appendChild(el('div', 'd-total', rupiah(i.total)));
      box.appendChild(r);
    });
    $('fCount').textContent = list.length + ' barang';
    $('fTotal').textContent = rupiah(list.reduce((s, i) => s + i.total, 0));
  }

  function exportCsv() {
    const esc = (v) => {
      const s = String(v === undefined || v === null ? '' : v);
      return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lines = ['File,Nama Barang,Banyak,Satuan,Harga,Total'];
    filtered().forEach((i) => lines.push([esc(i.file), esc(i.nama), i.banyak, esc(i.satuan), i.harga, i.total].join(',')));
    const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'dashboard-hpp-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function renderAll() {
    load();
    renderStats();
    renderChart();
    renderFiles();
    fillFilter();
    renderTable();
  }

  $('q').addEventListener('input', renderTable);
  $('fFile').addEventListener('change', renderTable);
  $('fSort').addEventListener('change', renderTable);
  $('btnCsv').addEventListener('click', exportCsv);
  // data ikut segar kalau Home diubah di tab lain atau tab ini kembali dibuka
  window.addEventListener('storage', (e) => { if (e.key === KEY) renderAll(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) renderAll(); });
  window.addEventListener('pageshow', (e) => { if (e.persisted) renderAll(); });

  renderAll();
})();
</script>
</body>
</html>
