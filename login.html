<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Masuk - Data HPP</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --panel-alt:#1e222b; --border:#2a2f3a; --text:#e8e9ec; --dim:#9aa0ab; --accent:#4f8cff; --red:#ff5d6c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.4;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .box { width: 100%; max-width: 380px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 14px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  label.f { display: block; font-size: 13px; color: var(--dim); margin: 0 0 6px; }
  input[type="text"], input[type="password"] {
    width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--panel-alt);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 14px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); margin: -4px 0 14px; }
  .chk input { width: 18px; height: 18px; margin: 0; }
  button.go {
    width: 100%; font: inherit; font-size: 15px; font-weight: 600; color: #fff; background: var(--accent);
    border: 1px solid var(--accent); border-radius: 8px; min-height: 46px; cursor: pointer;
  }
  button.go:hover { background: #3f7ae0; }
  button.go:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 20px; font-size: 13px; color: var(--red); margin: -2px 0 12px; }
  .banner { background: #3a2f12; border: 1px solid #8a6d1d; color: #ffe9a8; border-radius: 8px; padding: 12px; font-size: 13px; margin-bottom: 14px; }
  .note { color: var(--dim); font-size: 12px; margin-top: 14px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="box">
  <h1>Data HPP</h1>
  <div class="sub">Masuk untuk membuka data modal.</div>

  <div class="card">
    <div id="setup" class="banner" hidden>Firebase belum diatur. Isi file <b>firebase-config.js</b> dulu (lihat panduan), lalu muat ulang halaman ini.</div>

    <form id="form" autocomplete="on" novalidate>
      <label class="f" for="u">Username</label>
      <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>

      <label class="f" for="p">Password</label>
      <input type="password" id="p" name="password" autocomplete="current-password" required>

      <label class="chk"><input type="checkbox" id="show"> Tampilkan password</label>
      <div class="msg" id="msg" role="alert" aria-live="assertive"></div>
      <button type="submit" class="go" id="go">Masuk</button>
    </form>
  </div>
  <div class="note">Akun dibuat oleh admin. Hubungi admin kalau belum punya akun.</div>
</div>

<script type="module">
import * as cloud from './hpp-cloud.js';

const $ = (id) => document.getElementById(id);

function friendly(e) {
  const c = (e && e.code) || '';
  const map = {
    'auth/invalid-credential': 'Username atau password salah.',
    'auth/wrong-password': 'Username atau password salah.',
    'auth/user-not-found': 'Username atau password salah.',
    'auth/invalid-email': 'Username tidak valid.',
    'auth/too-many-requests': 'Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.',
    'auth/network-request-failed': 'Tidak ada koneksi internet. Coba lagi.',
    'auth/operation-not-allowed': 'Login Email/Password belum diaktifkan di Firebase (Authentication > Sign-in method).',
    'auth/invalid-api-key': 'API key di firebase-config.js tidak valid.'
  };
  return map[c] || ('Gagal: ' + (c || (e && e.message) || 'kesalahan tidak dikenal'));
}

async function init() {
  if (!cloud.configured) {
    $('setup').hidden = false;
    $('go').disabled = true;
    return;
  }
  const u = await cloud.ready;
  if (u) location.replace('index.html');
}

$('show').addEventListener('change', (e) => {
  $('p').type = e.target.checked ? 'text' : 'password';
});

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('msg');
  msg.textContent = '';
  const user = $('u').value.trim();
  const pass = $('p').value;
  if (!user || !pass) { msg.textContent = 'Username dan password wajib diisi.'; return; }

  const btn = $('go');
  btn.disabled = true;
  btn.textContent = 'Tunggu...';
  try {
    await cloud.login(user, pass);
    location.replace('index.html');
  } catch (err) {
    msg.textContent = friendly(err);
    btn.disabled = false;
    btn.textContent = 'Masuk';
  }
});

init();
</script>
</body>
</html>
