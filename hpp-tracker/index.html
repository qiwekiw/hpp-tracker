<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATA HPP - Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-alt: #1e222b;
    --border: #2a2f3a;
    --text: #e8e9ec;
    --text-dim: #9aa0ab;
    --accent: #4f8cff;
    --accent-dim: #2f4d8f;
    --green: #35c98f;
    --red: #ff5d6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }

  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  button {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.primary:hover { background: #3f7ae0; }
  button.danger { color: var(--red); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    text-align: left;
    padding: 10px 12px;
    background: var(--panel-alt);
    color: var(--text-dim);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  tbody tr:last-child td { border-bottom: none; }
  input {
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text);
    padding: 8px;
    border-radius: 6px;
    font-size: 14px;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--panel-alt);
  }
  input[type="number"] { text-align: right; }
  .col-total { text-align: right; color: var(--green); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .col-del { width: 36px; text-align: center; }
  .col-del button { padding: 4px 8px; }

  tfoot td {
    padding: 12px;
    font-weight: 700;
    background: var(--panel-alt);
  }
  tfoot .col-total { color: var(--green); font-size: 16px; }

  .empty {
    padding: 40px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  .footer-note {
    margin-top: 14px;
    color: var(--text-dim);
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>DATA HPP</h1>
  <div class="sub">Harga Pokok Penjualan / cost tracker — tersimpan otomatis di browser ini</div>

  <div class="toolbar">
    <button class="primary" onclick="addRow()">+ Tambah Barang</button>
    <button onclick="exportCSV()">Export CSV</button>
    <button onclick="document.getElementById('importFile').click()">Import CSV</button>
    <input type="file" id="importFile" accept=".csv" style="display:none" onchange="importCSV(event)">
    <button class="danger" onclick="clearAll()">Hapus Semua</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th style="width:34%">Nama Barang</th>
          <th style="width:14%">Banyak</th>
          <th style="width:14%">Satuan</th>
          <th style="width:18%">Harga</th>
          <th style="width:18%">Total</th>
          <th class="col-del"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
      <tfoot>
        <tr>
          <td colspan="4">Grand Total</td>
          <td class="col-total" id="grandTotal">Rp 0</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div class="footer-note">Data disimpan lokal (localStorage) di browser ini. Export CSV kalau mau backup atau pindah device.</div>
</div>

<script>
const STORAGE_KEY = 'hpp_tracker_data_v1';
let data = [];

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    data = raw ? JSON.parse(raw) : [];
  } catch (e) {
    data = [];
  }
  if (data.length === 0) addRow(false);
  render();
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.error('Gagal simpan:', e);
  }
}

function addRow(doSave = true) {
  data.push({ nama: '', banyak: '', satuan: '', harga: 0 });
  render();
  if (doSave) save();
}

function removeRow(idx) {
  data.splice(idx, 1);
  render();
  save();
}

function updateField(idx, field, value) {
  data[idx][field] = field === 'harga' ? (parseFloat(value) || 0) : value;
  render();
  save();
}

function formatRupiah(n) {
  return 'Rp ' + Math.round(n).toLocaleString('id-ID');
}

function render() {
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';

  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">Belum ada barang. Klik "+ Tambah Barang" untuk mulai.</td></tr>';
  } else {
    data.forEach((row, idx) => {
      const banyakNum = parseFloat(row.banyak) || 0;
      const total = banyakNum * (row.harga || 0);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="text" value="${escapeAttr(row.nama)}" placeholder="Nama barang" oninput="updateField(${idx},'nama',this.value)"></td>
        <td><input type="number" value="${escapeAttr(row.banyak)}" placeholder="0" oninput="updateField(${idx},'banyak',this.value)"></td>
        <td><input type="text" value="${escapeAttr(row.satuan)}" placeholder="pcs/kg/m" oninput="updateField(${idx},'satuan',this.value)"></td>
        <td><input type="number" value="${row.harga || ''}" placeholder="0" oninput="updateField(${idx},'harga',this.value)"></td>
        <td class="col-total">${formatRupiah(total)}</td>
        <td class="col-del"><button class="danger" onclick="removeRow(${idx})" title="Hapus">✕</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  const grand = data.reduce((sum, row) => sum + ((parseFloat(row.banyak) || 0) * (row.harga || 0)), 0);
  document.getElementById('grandTotal').textContent = formatRupiah(grand);
}

function escapeAttr(v) {
  return String(v ?? '').replace(/"/g, '&quot;');
}

function clearAll() {
  if (confirm('Hapus semua data HPP? Tindakan ini tidak bisa dibatalkan.')) {
    data = [];
    addRow(false);
    save();
  }
}

function exportCSV() {
  const header = 'Nama Barang,Banyak,Satuan,Harga,Total\n';
  const rows = data.map(r => {
    const banyakNum = parseFloat(r.banyak) || 0;
    const total = banyakNum * (r.harga || 0);
    return [csvEscape(r.nama), csvEscape(r.banyak), csvEscape(r.satuan), r.harga || 0, total].join(',');
  }).join('\n');
  const csv = header + rows;
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `data-hpp-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function csvEscape(v) {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
    const startIdx = /nama barang/i.test(lines[0]) ? 1 : 0;
    const imported = [];
    for (let i = startIdx; i < lines.length; i++) {
      const cols = parseCSVLine(lines[i]);
      if (cols.length < 4) continue;
      imported.push({
        nama: cols[0] || '',
        banyak: cols[1] || '',
        satuan: cols[2] || '',
        harga: parseFloat(cols[3]) || 0
      });
    }
    if (imported.length > 0) {
      data = imported;
      render();
      save();
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function parseCSVLine(line) {
  const result = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { cur += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { result.push(cur); cur = ''; }
      else cur += c;
    }
  }
  result.push(cur);
  return result;
}

load();
</script>
</body>
</html>
